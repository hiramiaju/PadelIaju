services:
  - type: web
    name: iaju-padel-flask
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 60 app:app
    healthCheckPath: /health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: INSTITUTE_WHATSAPP
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: LOCAL_TIMEZONE
        value: America/Mexico_City
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
    disk:
      name: iaju-data
      mountPath: /var/data
      sizeGB: 1
